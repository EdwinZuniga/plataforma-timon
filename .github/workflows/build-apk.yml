name: Build APK Android

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName visible (ej. 1.0.3). Vacío = usar el del build.gradle'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build frontend + sync Capacitor
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Fijar versionCode / versionName
        working-directory: frontend/android/app
        run: |
          # versionCode incremental para poder instalar la APK sobre la anterior.
          VCODE=$(( 1000 + ${{ github.run_number }} ))
          sed -i "s/versionCode [0-9]*/versionCode ${VCODE}/" build.gradle
          echo "versionCode -> ${VCODE}"
          VNAME='${{ github.event.inputs.versionName }}'
          if [ -z "$VNAME" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then VNAME="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$VNAME" ]; then
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VNAME}\"/" build.gradle
            echo "versionName -> ${VNAME}"
          fi

      - name: Restaurar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64. Configúralo en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/frontend/android/app/timon-release.jks"

      - name: Compilar APK de release (firmado)
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/app/timon-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        id: apk
        working-directory: frontend/android/app/build/outputs/apk/release
        run: |
          NAME="plataforma-timon-${GITHUB_REF_NAME//\//-}.apk"
          cp app-release.apk "$NAME"
          echo "path=frontend/android/app/build/outputs/apk/release/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publicar en el Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
