name: Deploy Backend → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend build into backend/public
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/. backend/public/

      - name: Create deployment zip (sin node_modules)
        run: |
          cd backend
          zip -r ../app.zip . \
            --exclude "node_modules/*" \
            --exclude ".env" \
            --exclude "uploads/*" \
            --exclude "*.traineddata"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          package: app.zip
